name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check web/client.js

  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ["10.11", "12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: ./plugin/build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: HAnimeDownloader_${{ matrix.target }}
          path: dist/HAnimeDownloader_${{ matrix.target }}.zip
